# Publica la app web en GitHub Pages cada vez que se sube algo a feature/webar.
# Dirección: https://<usuario>.github.io/<repo>/  (por ejemplo, https://isconnei.github.io/AR-HelloWorld/)
name: Publicar en GitHub Pages

on:
  push:
    branches: [feature/webar]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, gana el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # La app vive en una subcarpeta (/<repo>/), así que Vite debe saberlo al compilar.
      - run: npm run build -- --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
